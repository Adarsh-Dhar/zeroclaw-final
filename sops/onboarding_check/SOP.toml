[sop]
name = "onboarding_check"
description = "Poll Signup_Channel every 5 minutes for WALLET_VERIFIED messages to handle registration, and poll Subscribe_Channel for subscribe commands to invoke the Onboarding SKILL"
version = "1.0.0"
max_concurrent = 5
execution_mode = "auto"
enabled = false

[[triggers]]
type = "cron"
expression = "*/5 * * * *"

[[triggers]]
type = "manual"
