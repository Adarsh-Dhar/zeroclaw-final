[sop]
name = "subscription_commands"
description = "Poll Subscription_Channel every 5 minutes for subscribe commands from registered users and invoke the Onboarding SKILL for each qualifying message"
version = "1.0.0"
max_concurrent = 1
admission_policy = "parallel"
max_pending_approvals = 10
dispatch_mode = "headless"
auto_approve = true

